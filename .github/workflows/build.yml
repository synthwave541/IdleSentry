name: macOS build
on:
  push:
    branches: [main, macOS-stable]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify presentation, settings compatibility and app discovery
        run: bash tests/run-checks.sh
      - name: Build and verify universal app
        run: |
          bash package.sh
          python3 -c 'import subprocess; assert set(subprocess.check_output(["lipo", "-archs", "build/IdleSentry.app/Contents/MacOS/IdleSentry"], text=True).split()) == {"arm64", "x86_64"}'
          codesign --verify --deep --strict build/IdleSentry.app
          VERSION=$(tr -d '\r\n' < VERSION)
          ditto -c -k --sequesterRsrc --keepParent build/IdleSentry.app "IdleSentry-${VERSION}-macOS.zip"
          shasum -a 256 "IdleSentry-${VERSION}.dmg" "IdleSentry-${VERSION}-macOS.zip" > SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: IdleSentry-macOS-release
          path: |
            IdleSentry-*.dmg
            IdleSentry-*-macOS.zip
            SHA256SUMS.txt
          if-no-files-found: error
