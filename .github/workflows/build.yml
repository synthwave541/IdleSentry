name: macOS build
on:
  push:
    branches: [main, macOS-stable]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify presentation, settings compatibility and app discovery
        run: bash tests/run-checks.sh
      - name: Build and verify universal app
        run: |
          bash build.sh universal
          lipo build/IdleSentry.app/Contents/MacOS/IdleSentry -verify_arch arm64 x86_64
          codesign --verify --deep --strict build/IdleSentry.app
          ditto -c -k --sequesterRsrc --keepParent build/IdleSentry.app build/IdleSentry-macOS.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: IdleSentry-macOS-universal
          path: build/IdleSentry-macOS.zip
          if-no-files-found: error
